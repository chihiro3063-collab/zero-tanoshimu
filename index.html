<script>
'use strict';
/* =====================================================================
   ゼロまで、たのしむ — 計算の部分 (今までのシミュレーターのロジックをそのまま使用)
   ===================================================================== */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/[^\d.\-]/g,'')); return isNaN(n) ? 0 : n; };
const fmt = n => Math.round(n).toLocaleString('ja-JP');
const man = n => fmt(n/10000).replace('-','−');
const sman = n => { const m = Math.round(n/10000); return (m>0?'+':m<0?'−':'') + Math.abs(m).toLocaleString('ja-JP') + '万円'; };

/* --- 額面 → 手取り の概算 (単身・扶養なし) --- */
function employmentIncomeDeduction(g){
  if(g<=0) return 0;
  if(g<=1625000) return Math.min(g,550000);
  if(g<=1800000) return g*0.4-100000;
  if(g<=3600000) return g*0.3+80000;
  if(g<=6600000) return g*0.2+440000;
  if(g<=8500000) return g*0.1+1100000;
  return 1950000;
}
function progressiveIncomeTax(t){
  const br=[[1950000,0.05,0],[3300000,0.10,97500],[6950000,0.20,427500],[9000000,0.23,636000],[18000000,0.33,1536000],[40000000,0.40,2796000],[Infinity,0.45,4796000]];
  for(const [lim,r,d] of br){ if(t<=lim) return Math.max(0,t*r-d); }
  return 0;
}
function estimateNetIncome(g){
  if(g<=0) return 0;
  const ed=employmentIncomeDeduction(g), sh=g*0.145;
  const tn=Math.max(0,g-ed-sh-480000);
  const it=progressiveIncomeTax(tn)*1.021;
  const tr=Math.max(0,g-ed-sh-430000);
  return Math.max(0,Math.round(g-sh-it-(tr*0.10+5000)));
}

/* --- 物価上昇: 今日0% → 退職年齢で指定の率 → 以降一定 --- */
function buildIdx(age0, retireAge, totalYears, target){
  const idx=[1], ramp=Math.max(1,retireAge-age0);
  for(let i=0;i<totalYears-1;i++){ const t=Math.min(1,i/ramp); idx.push(idx[i]*(1+target*t)); }
  return idx;
}

/* --- 状態 --- */
function defaultState(){
  return {
    age:32, retireAge:65, lifeEnd:95,
    cash:2500000, invest:3700000, returnRate:3,
    incomeMode:'net', income:4800000, raiseRate:1.5,
    spouse:[], careerChanges:[], pension:150000,
    expense:250000, postExpense:210000, inflation:2,
    fixed:[], monthlyInvest:30000, leave:0,
    wishes:[], mf:null, whatifs:[], viewEnd:65, branchSpend:5000000, branchYears:5, branchStart:0, shares:{food:24,travel:9,move:12,beauty:1,home:9,daily:9,health:7,hobby:1,learn:1,social:2,kids:16}, spareNow:42000
  };
}
function sampleState(){
  const s=defaultState();
  s.returnRate=3; s.expense=280000; s.postExpense=230000; s.inflation=2;
  s.whatifs=[{type:'child',age:36,cost:1000000,years:22,birth:500000,on:true},{type:'retire',age:55,on:false}];
  s.wishes=[
    {id:1,name:'家族で沖縄旅行',amount:400000,age:33,repeat:false,endAge:33,status:'decided'},
    {id:2,name:'車の買い替え',amount:2500000,age:36,repeat:false,endAge:36,status:'considering'},
    {id:3,name:'夫婦でヨーロッパ旅行',amount:1200000,age:40,repeat:false,endAge:40,status:'idea'}
  ];
  return s;
}

let S = defaultState();
let WF = {};
let UI = {shopAmount:0, shopName:'', filter:'all', open:3, editing:null, ob:{age:0,asset:0,income:0,living:0,save:0}, tab:'start', prev:'home'};
let store = {started:false, S:null, patterns:[null,null,null], cur:0};
const KEY='zero_tanoshimu_v1';
let idSeq = Date.now();
const newId = () => ++idSeq;

function loadStore(){
  try{
    const t = localStorage.getItem(KEY);
    if(t){ const o=JSON.parse(t); store=Object.assign(store,o); if(o.S) S=Object.assign(defaultState(),o.S); }
  }catch(e){}
}
function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify(Object.assign({},store,{S}))); }catch(e){}
}
function resetWF(){ WF = {id:null,name:'',amount:0,age:Math.round(S.age)+1,repeat:false,endAge:Math.round(S.age)+5,status:'idea'}; }

/* --- やりたいこと → 計算用のイベント --- */
function wishToEvent(w){
  return {type:w.repeat?'repeat':'once', startAge:w.age, endAge:w.repeat?w.endAge:w.age, amount:w.amount};
}
function wishEvents(mode){
  if(mode==='none') return [];
  if(Array.isArray(mode)) return mode.map(wishToEvent);
  if(mode==='all') return S.wishes.map(wishToEvent);
  return S.wishes.filter(w=>w.status==='decided').map(wishToEvent); // 'decided'(標準)
}

/* --- 本体: 年ごとの資産の計算 --- */
function simulate(o={}){
  const age0 = Math.round(S.age)||0;
  const lifeEnd = Math.max(age0, Math.round(S.lifeEnd)||0);
  const retireAge = o.retireAge!==undefined ? o.retireAge : S.retireAge;
  const total = Math.max(1, lifeEnd-age0+1);
  const idx = buildIdx(age0, retireAge, total, S.inflation/100);
  const toNet = a => S.incomeMode==='gross' ? estimateNetIncome(a) : a;
  const career = (o.career || S.careerChanges).slice().sort((a,b)=>a.age-b.age);
  const fixedEvents = S.fixed, wishEvs = wishEvents(o.wish).concat(o.extra||[]);
  const r = S.returnRate/100, raise = S.raiseRate/100;
  const yearlyInvest = S.monthlyInvest*12;
  let cash=S.cash, invest=S.invest, insolventAge=null;
  const results=[];
  for(let i=0;i<total;i++){
    const age=age0+i, retired=age>=retireAge;
    let incomeY=0;
    if(!retired){
      let active=null; for(const c of career){ if(c.age<=age) active=c; else break; }
      incomeY = toNet(active ? active.income : S.income*Math.pow(1+raise, age-age0));
    }
    let spouseY=0;
    S.spouse.concat(o.spouseExtra||[]).forEach(s=>{ if(age>=s.startAge && age<=s.endAge) spouseY+=toNet(s.income); });
    const living = retired ? S.postExpense*12*idx[i] : S.expense*12*idx[i];
    const pensionY = age>=Math.max(retireAge,65) ? S.pension*12*idx[i] : 0;
    const evSum=list=>{ let t=0; list.forEach(e=>{
      const amt=e.amount*idx[i];
      if(e.type==='once' && Math.round(e.startAge)===age) t+=amt;
      if(e.type==='repeat' && age>=e.startAge && age<=e.endAge) t+=amt;
    }); return t; };
    const fixedY=evSum(fixedEvents), wishY=evSum(wishEvs), eventY=fixedY+wishY;
    const contrib = retired ? 0 : yearlyInvest;
    const growth = invest*r, net = incomeY+spouseY+pensionY-living-eventY-contrib;
    cash += net;
    invest = invest*(1+r)+contrib;
    let drew=0;
    if(cash<0){
      const sf=-cash; drew=sf;
      if(invest>=sf){ invest-=sf; cash=0; }
      else { cash=-(sf-invest); invest=0; if(insolventAge===null) insolventAge=age; }
    }
    results.push({age,cash,invest,total:cash+invest,draw:drew,income:incomeY,spouse:spouseY,pension:pensionY,living,fixedY,wishY,contrib,growth,net,retired});
  }
  return {results, insolventAge, retireAge, lifeEnd};
}

/* --- 「あと使える額」: 今、追加でいくらまで使っても、寿命の年に「残したい額」を割らないか --- */
function finalTotal(o, X){
  const ex=(o.extra||[]).concat([{type:'once',startAge:Math.round(S.age),endAge:Math.round(S.age),amount:X}]);
  const r=simulate(Object.assign({},o,{extra:ex}));
  return r.results[r.results.length-1].total;
}
function okAfter(o){
  const r=simulate(o).results;
  return r[r.length-1].total>=S.leave && r.every(x=>x.total>=0);
}
function spendable(o={}){
  let lo=-3e9, hi=3e9;
  for(let i=0;i<46;i++){
    const mid=(lo+hi)/2;
    if(finalTotal(o,mid) >= S.leave) lo=mid; else hi=mid;
  }
  return lo;
}

function viewEnd(){
  const a=Math.round(S.age); const v=Math.round(S.viewEnd)||S.retireAge;
  return Math.max(a+1, Math.min(S.lifeEnd, v));
}
const WTYPES={
  job:{label:'転職・収入が変わる',icon:'brief'},
  child:{label:'子どもが生まれる',icon:'heart'},
  retire:{label:'早めに退職する',icon:'flag'},
  side:{label:'副業を始める',icon:'yen'},
  cost:{label:'大きな出費(家・引っ越し)',icon:'home'}
};
function wiParts(list){
  const career=S.careerChanges.slice(), extra=[], spouseExtra=[]; let retireAge;
  list.filter(w=>w.on).forEach(w=>{
    if(w.type==='job') career.push({age:w.age,income:w.income});
    if(w.type==='child'){
      extra.push({type:'repeat',startAge:w.age,endAge:w.age+Math.max(1,w.years)-1,amount:w.cost});
      if(w.birth>0) extra.push({type:'once',startAge:w.age,endAge:w.age,amount:w.birth});
    }
    if(w.type==='retire') retireAge = retireAge===undefined ? w.age : Math.min(retireAge,w.age);
    if(w.type==='side') spouseExtra.push({startAge:w.age,endAge:w.endAge,income:w.income});
    if(w.type==='cost') extra.push(w.repeat?{type:'repeat',startAge:w.age,endAge:w.endAge,amount:w.amount}:{type:'once',startAge:w.age,endAge:w.age,amount:w.amount});
  });
  const o={wish:'decided',extra,career,spouseExtra};
  if(retireAge!==undefined) o.retireAge=retireAge;
  return o;
}
/* 「いつ使える?」: 開始年齢ごとに、95歳の資産がどうなるかを調べる */
function whenState(){
  const g=suggest(); const a0=Math.round(S.age);
  return {st: Math.round(S.branchStart)>0 ? Math.round(S.branchStart) : (g&&g.st?g.st:a0)};
}
function whenCalc(){
  const a0=Math.round(S.age), yrs=Math.max(1,Math.min(Math.round(S.branchYears)||1, S.lifeEnd-a0));
  const total=S.branchSpend, base=simulate({wish:'decided'}).results, last=S.lifeEnd-yrs+1, rows=[];
  for(let st=a0; st<=last; st++){

function suggest(){

  let st=Math.ceil((a0+2)/5)*5; if(st+yrs-1>S.lifeEnd) st=a0;
  const en=st+yrs-1; if(en>S.lifeEnd) return null;
  const sp=M=>({wish:'decided',extra:[{type:'repeat',startAge:st,endAge:en,amount:M/yrs}]});
  if(!okAfter(sp(0))) return {st,en,yrs,short:true};
  let lo=0,hi=3e9; for(let i=0;i<40;i++){ const m=(lo+hi)/2; if(okAfter(sp(m))) lo=m; else hi=m; }

function parseCSV(t){

  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(f); f=''; if(row.length>1||row[0]!=='') rows.push(row); row=[]; }
    else f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }

async function unzipAll(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf), dec=new TextDecoder('utf-8');
  let e=buf.byteLength-22; while(e>=0&&dv.getUint32(e,true)!==0x06054b50) e--;
  if(e<0) throw new Error('zip');
  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const files={};
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50) throw new Error('zip');
    const method=dv.getUint16(p+10,true), cs=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lho=dv.getUint32(p+42,true);
    const name=dec.decode(u8.slice(p+46,p+46+nl)); p+=46+nl+el+cl;
    const ln=dv.getUint16(lho+26,true), le=dv.getUint16(lho+28,true), st=lho+30+ln+le;
    files[name]={method,data:u8.slice(st,st+cs)};
  }
  const get=async name=>{ const f=files[name]; if(!f) return null; const d=f.method===0?f.data:await inflateRaw(f.data); return dec.decode(d); };
  return {names:Object.keys(files),get};
}

  const sheets=z.names.filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort((a,b)=>parseInt(a.match(/(\d+)\.xml/)[1])-parseInt(b.match(/(\d+)\.xml/)[1]));
  const out=[];
  for(const nm of sheets){
    const doc=xp.parseFromString(await z.get(nm),'application/xml'), rows=[];
    doc.querySelectorAll('sheetData > row').forEach(r=>{
      const row=[]; r.querySelectorAll(':scope > c').forEach(c=>{
        const t=c.getAttribute('t'), ci=colNum(c.getAttribute('r')); let v='';
        if(t==='inlineStr') v=[...c.querySelectorAll('is t')].map(x=>x.textContent).join('');

        row[ci]=v;

    if(iT>=0&&String(r[iT]).trim()==='1') return;
    const dt=parseDate(r[iD]); if(!dt) return;
    items.push({dt,amt:toNum(r[iA]),big:(r[iB]||'').trim(),mid:(r[iM]||'').trim()});
  });
  if(!items.length) return null;
  const last=items.reduce((a,b)=>a.dt.key*100+a.dt.d>=b.dt.key*100+b.dt.d?a:b).dt, first=items.reduce((a,b)=>a.dt.key*100+a.dt.d<=b.dt.key*100+b.dt.d?a:b).dt;
  const cur=last.key;
  let keys=[...new Set(items.map(x=>x.dt.key))].sort((a,b)=>a-b);
  let ref=keys.filter(k=>k<cur).slice(-3); const onlyCur=!ref.length; if(onlyCur) ref=[cur];
  const notes=[]; if(onlyCur) notes.push('1か月分しかないため、今月のデータで計算しています。');
  const exp=items.filter(x=>x.amt<0), inc=items.filter(x=>x.amt>0);
  const isRinji=x=>-x.amt>=100000&&!FIXED_BIG.has(x.big);
  const usable=x=>!SKIP_BIG.has(x.big)&&x.big!=='未分類'&&!isRinji(x);
  const sal={}; inc.filter(x=>x.big==='収入'&&x.mid==='給与').forEach(x=>{ sal[x.dt.key]=(sal[x.dt.key]||0)+x.amt; });
  const salM=ref.filter(k=>sal[k]>0); const avgSalary=salM.length?salM.reduce((a,k)=>a+sal[k],0)/salM.length:null;
  const inRef=x=>ref.includes(x.dt.key);
  const fixed=exp.filter(x=>inRef(x)&&FIXED_BIG.has(x.big)).reduce((a,x)=>a-x.amt,0)/ref.length;
  const variable=exp.filter(x=>inRef(x)&&!FIXED_BIG.has(x.big)&&usable(x)).reduce((a,x)=>a-x.amt,0)/ref.length;
  const curVar=exp.filter(x=>x.dt.key===cur&&!FIXED_BIG.has(x.big)&&usable(x)).reduce((a,x)=>a-x.amt,0);
  const spare=avgSalary!=null ? avgSalary-fixed-S.monthlyInvest-curVar : null;
  const skipM=exp.filter(x=>inRef(x)&&SKIP_BIG.has(x.big)).reduce((a,x)=>a-x.amt,0)/ref.length;
  const rinji=exp.filter(x=>isRinji(x)&&x.big!=='現金・カード'); 
  const unc=exp.filter(x=>x.big==='未分類');

  const shares={}; GENRES.forEach(g=>{ shares[g[0]]= tot>0 ? Math.round((sh[g[0]]||0)/tot*100) : 0; });
  if(inc.some(x=>x.mid==='賞与')) notes.push('賞与(ボーナス)は、年収に含めていません。');

}
function analyzeAsset(rows){
  const h=rows[0], iD=colIdx(h,'日付');
  const cashCols=h.map((x,i)=>i).filter(i=>/預金|現金/.test(h[i])&&!/合計/.test(h[i]));
  const invCols=h.map((x,i)=>i).filter(i=>/株式|投資信託|債券/.test(h[i]));
  if(!cashCols.length&&!invCols.length) return null;
  let best=null;
  rows.slice(1).forEach(r=>{ const dt=parseDate(r[iD]); if(dt&&(!best||dt.key*100+dt.d>=best.dt.key*100+best.dt.d)) best={dt,r}; });
  if(!best) return null;
  return {date:best.dt.str,cash:cashCols.reduce((a,i)=>a+toNum(best.r[i]),0),invest:invCols.reduce((a,i)=>a+toNum(best.r[i]),0),cols:cashCols.concat(invCols).map(i=>h[i])};
}
function applyMF(cf,as){
  const m=S.mf||{locked:{},values:{},manual:{}}; m.locked=m.locked||{}; m.values=m.values||{}; m.manual=m.manual||{};
  const set=(k,v)=>{ S[k]=v; m.values[k]=v; if(!m.manual[k]) m.locked[k]=true; };
  const done=[];
  if(cf){
    if(cf.avgSalary){ set('income',Math.round(cf.avgSalary*12/10000)*10000); S.incomeMode='net'; done.push('年収'); }
    set('expense',Math.round(cf.living/1000)*1000); done.push('生活費');
    if(cf.spare!=null){ set('spareNow',Math.round(cf.spare/100)*100); done.push('今月の余裕'); }
    if(cf.shares){ S.shares=cf.shares; m.sharesLocked=true; done.push('うちの子'); }

}
async function handleFiles(files){
  const out={cf:null,as:null,errors:[],names:[]};
  for(const f of files){
    try{
      const rows=(await readTableFiles(f))[0], kind=detectKind(rows);
      if(kind==='cash'){ const r=analyzeCash(rows); if(r){ out.cf=r; out.names.push(f.name+'(収支)'); } else out.errors.push(`${f.name}: 読める行がありませんでした。`); }

    }catch(e){ out.errors.push(e&&e.message==='xls'?`${f.name}: 古い形式のExcel(.xls)は読めません。.xlsxで保存し直してください。`:`${f.name}: 読み込めませんでした。`); }

function ocrNums(l){
  const out=[]; const re=/\d{1,3}(?:\s?[,，.、]\s?\d{3})+|\d{4,}/g; let m;
  while((m=re.exec(l))){ const v=parseInt(m[0].replace(/[^0-9]/g,''),10); if(v>=1000) out.push(v); }
  return out;
}
function parseAssetText(text){
  const lines=String(text||'').split(/\r?\n/).map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean);
  const kinds=[['total',/合計/],['fund',/投資信託|投信/],['stock',/株式|現物/],['cash',/預金|現金/],['bond',/債券/],['point',/ポイント|ポイン/]];
  const r={cash:0,fund:0,stock:0,bond:0,point:0,total:0}, found={};
  lines.forEach((l,i)=>{
    const k=kinds.find(x=>x[1].test(l)); if(!k||found[k[0]]) return;
    let n=ocrNums(l);
    if(!n.length&&lines[i+1]&&!kinds.some(x=>x[1].test(lines[i+1]))&&!/前日比|ヶ月前比|ヵ月前比/.test(lines[i+1])) n=ocrNums(lines[i+1]);
    if(n.length){ r[k[0]]=Math.max(...n); found[k[0]]=true; }
  });
  r.found=found; return r;
}
function loadTess(){
  return new Promise((res,rej)=>{
    if(window.Tesseract) return res(window.Tesseract);
    const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    sc.onload=()=>window.Tesseract?res(window.Tesseract):rej(new Error('no-tess')); sc.onerror=()=>rej(new Error('load')); document.head.appendChild(sc);
  });
}
function ocrStatus(t){ const e=$('#ocrStatus'); if(e) e.textContent=t; }
async function ocrFile(file){
  if(!file) return;

  UI.ocrUrl=URL.createObjectURL(file); UI.ocrState='busy'; UI.ocr=null; UI.ocrMsg=''; render();

    ocrStatus('文字認識の部品を準備しています…(初回は少し時間がかかります)');
    const T=await loadTess();
    const worker=await T.createWorker('jpn',1,{logger:m=>{ if(m.status) ocrStatus(`読み取り中… ${m.status==='recognizing text'?Math.round((m.progress||0)*100)+'%':'準備中'}`); }});
    const {data}=await worker.recognize(file); try{ await worker.terminate(); }catch(e){}
    const r=parseAssetText(data.text);

  }

}

    ${ticksSVG(res)}`;
  return mkChart('plan',inner,{n,px:res.map((_,i)=>X(i)),
    series:[{color:'#3B3350',py:tots.map(Y)}],
    read:i=>`<b>${res[i].age}歳</b> 合計 <b>${man(tots[i])}万円</b><br><span style="color:var(--dim)">投資 ${man(res[i].invest)}万円 ・ 現金 ${man(res[i].cash)}万円</span>`},'資産の推移のグラフ。指でなぞると金額が見えます');
}
function lineChart2(a, b, ages, age0, id, nA, nB){
  const n=a.length;
  const all=a.concat(b).map(r=>r.total);
  const mx=Math.max(1,...all), mn=Math.min(0,...all);
  const X=i=>CX0+(CX1-CX0)*i/Math.max(1,n-1), Y=v=>CYB-(CYB-CYT)*(v-mn)/Math.max(1,mx-mn);
  const pl=r=>r.map((p,i)=>`${X(i).toFixed(1)},${Y(p.total).toFixed(1)}`).join(' ');
  const marks=(ages||[]).filter(g=>g-age0>=0&&g-age0<=n-1).map(g=>{const x=X(g-age0).toFixed(1);return `<line x1="${x}" y1="${CYT-6}" x2="${x}" y2="${CYB}" stroke="#B7A3DA" stroke-dasharray="3 3"/><text x="${Math.min(290,+x+3)}" y="${CYT+2}" font-size="10" fill="#5E5577">${g}歳</text>`;}).join('');
  const inner=`${gridSVG(mn,mx,Y)}${marks}
    <polyline points="${pl(a)}" fill="none" stroke="#A794CC" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="${pl(b)}" fill="none" stroke="#6B55A0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${ticksSVG(a)}`;
  return mkChart(id,inner,{n,px:a.map((_,i)=>X(i)),
    series:[{color:'#A794CC',py:a.map(r=>Y(r.total))},{color:'#6B55A0',py:b.map(r=>Y(r.total))}],
    read:i=>{const d=b[i].total-a[i].total;return `<b>${a[i].age}歳</b>　${nA} <b>${man(a[i].total)}万円</b> ／ ${nB} <b>${man(b[i].total)}万円</b><br><span style="color:var(--dim)">差 ${sman(d)}</span>`;}},'資産の推移の比較。指でなぞると金額が見えます');
}
function scrub(e){
  const c=e.target.closest&&e.target.closest('.chart'); if(!c) return;
  const m=CH[c.dataset.cid]; if(!m) return;
  const svg=c.querySelector('svg'), r=svg.getBoundingClientRect(); if(!r.width) return;
  const vx=(e.clientX-r.left)/r.width*320;
  let i=Math.round((vx-CX0)/(CX1-CX0)*(m.n-1)); i=Math.max(0,Math.min(m.n-1,i));
  const cur=svg.querySelector('.cur'); cur.setAttribute('x1',m.px[i]); cur.setAttribute('x2',m.px[i]); cur.setAttribute('visibility','visible');
  svg.querySelectorAll('.dot').forEach(d=>{const sr=m.series[+d.dataset.k]; d.setAttribute('cx',m.px[i]); d.setAttribute('cy',sr.py[i]); d.setAttribute('visibility','visible');});
  c.querySelector('.readout').innerHTML=m.read(i);
}
document.addEventListener('pointermove',scrub);
document.addEventListener('pointerdown',scrub);

function shopHTML(c){
  const A=UI.shopAmount;
  if(!(A>0)) return `<p class="note">金額を入れると、今月の余裕に収まるか、人生で使える額がいくら減るかがわかります。</p>`;
  const spare=S.spareNow;
  const left=spare-A;
  const after=spendable({wish:'decided', extra:[{type:'once',startAge:Math.round(S.age),endAge:Math.round(S.age),amount:A}]});
  const r=S.returnRate/100, yrs=Math.max(0,S.lifeEnd-S.age);
  const fv=A*Math.pow(1+r,yrs);
  let delay='';
  if(after<0){
    const later=spendable({wish:'decided', retireAge:S.retireAge+1});
    const gain=later-c.Tdec;
    delay = gain>0 ? `<div class="rs">退職を 約${Math.ceil(-after/gain*12)}か月 遅らせれば、収まる計算です(目安)。</div>` : `<div class="rs">退職を遅らせても、取り戻しにくい計算です。</div>`;
  }
  return `<div class="rblk"><div class="rk">今月の余裕</div>
      <div class="rv ${left>=0?'ok':'ng'}">${left>=0?'収まる':'超える'}</div>
      <div class="rs">${left>=0?`買ったあと、今月はあと ${fmt(left)}円 使えます。`:`今月の余裕を ${fmt(-left)}円 超えます。`}</div></div>

}

function whatifResult(){
  const a0=Math.round(S.age), X=viewEnd(), n=X-a0+1;
  const act=S.whatifs.filter(w=>w.on);
  if(!act.length) return `<p class="note">「比べている」もしもが、まだありません。</p>`;
  const parts=wiParts(S.whatifs);
  const A=simulate({wish:'decided'}).results, B=simulate(parts).results;
  const c=calc(), Tb=spendable(parts), d=Tb-c.Tdec;
  const col=(k,v,v2,dark)=>`<div style="flex:1;${dark?'background:var(--p);color:#fff':'background:#fff'};border-radius:12px;padding:12px"><div style="font-size:12px;opacity:.8">${k}</div><div style="margin-top:4px"><b style="font-size:22px">${v}</b><b style="font-size:12px"> 万円</b></div><div style="font-size:11.5px;opacity:.8;margin-top:6px">${v2}</div></div>`;
  const ages=act.map(w=>w.age);
  return `<div class="rbox">

    <div style="display:flex;gap:10px;margin-top:10px">${col('今のまま',man(A[n-1].total),`${S.lifeEnd}歳: ${man(A[A.length-1].total)}万円`,false)}${col('もしも全部',man(B[n-1].total),`${S.lifeEnd}歳: ${man(B[B.length-1].total)}万円`,true)}</div>

    <div style="margin-top:16px">${lineChart2(A.slice(0,n),B.slice(0,n),ages,a0,'wi','今のまま','もしも全部')}
    <div class="legend"><span><em style="background:#A794CC"></em>今のまま</span><span><em style="background:#6B55A0"></em>もしも全部</span></div></div>`;
}

  hCap:(el,c)=>{ el.innerHTML = `${S.lifeEnd}歳のとき、${S.leave>0?man(S.leave)+'万円':'お金を 0円'} 残す計算です。<br>決定したこと(${man(c.D)}万円)は、もう引いてあります。`; },
  hBar:(el,c)=>{

  wBar:(el,c)=>{
    const cap=Math.max(1,c.T0), w=v=>Math.max(0,Math.min(100,v/cap*100));

function petStrength(v){ return Math.max(0,Math.min(1,((+v||0)-1)/15)); }
function petType(sh){
  const arr=GENRES.map(g=>[g,+sh[g[0]]||0]).sort((a,b)=>b[1]-a[1]);
  const top=arr[0], sec=arr[1];
  if(!(top[1]>0)) return {name:'うまれたて型',desc:'まだ、なにも育っていません。'};
  return {name:top[0][4], desc:`${top[0][3]}${sec[1]>=3?`と、${sec[0][3]}`:''}が育ちました。`};
}
function petSVG(sh, px){
  const st=k=>petStrength(sh[k]);
  const f=st('food'), tr=st('travel'), mv=st('move'), bt=st('beauty'), hm=st('home'), dl=st('daily'), hl=st('health'), hb=st('hobby'), ln=st('learn'), sc=st('social'), kd=st('kids');
  const cx=120, cy=128, rx=56+22*f, ry=50+20*f;
  const ex=rx*0.36, ey=cy-4;
  const wing=(sx)=>{ const w=0.35+0.95*tr; return `<g transform="translate(${cx+sx*(rx-8)},${cy-6}) scale(${sx*w},${w})"><path d="M0,0 C32,-26 62,-16 66,-48 C50,-42 42,-52 30,-54 C36,-38 18,-30 0,-14 Z" fill="#fff" stroke="#BBA8DD" stroke-width="2.5" stroke-linejoin="round"/><path d="M14,-14 C30,-22 44,-26 52,-36" fill="none" stroke="#DCD0EE" stroke-width="2.5" stroke-linecap="round"/></g>`; };
  const foot=(sx)=>{ const fx=cx+sx*rx*0.45, fy=cy+ry-2;
    return mv>0.3 ? `<rect x="${fx-15}" y="${fy-10-14*mv}" width="30" height="${22+14*mv}" rx="9" fill="#5B4A86"/><rect x="${fx-15}" y="${fy-10-14*mv}" width="30" height="7" rx="3.5" fill="#8B6FC4"/>`
                  : `<ellipse cx="${fx}" cy="${fy+4}" rx="15" ry="9" fill="#B7A3DA"/>`; };
  const sparkle=(x,y,r)=>`<path d="M${x},${y-r} L${x+r*0.28},${y-r*0.28} L${x+r},${y} L${x+r*0.28},${y+r*0.28} L${x},${y+r} L${x-r*0.28},${y+r*0.28} L${x-r},${y} L${x-r*0.28},${y-r*0.28} Z" fill="#F2D27A"/>`;
  let o=`<defs><radialGradient id="aura"><stop offset="0%" stop-color="#7FC4B6" stop-opacity=".9"/><stop offset="100%" stop-color="#7FC4B6" stop-opacity="0"/></radialGradient></defs>`;
  if(hl>0.05) o+=`<circle cx="${cx}" cy="${cy}" r="${rx+26+26*hl}" fill="url(#aura)" opacity="${(0.25+0.7*hl).toFixed(2)}"/>`;
  if(hm>0.05){ o+=`<ellipse cx="${cx}" cy="${cy+ry+8}" rx="${rx+34+22*hm}" ry="${18+14*hm}" fill="#EFE5F4"/><ellipse cx="${cx}" cy="${cy+ry+10}" rx="${rx+18+18*hm}" ry="${12+10*hm}" fill="#E3D3F0" stroke="#CDB9E6" stroke-width="2"/>`; }
  if(hb>0.12) o+=`<path d="M${cx+rx-8},${cy+22} q${28+10*hb},-4 ${30+10*hb},${-36-14*hb}" fill="none" stroke="#A794CC" stroke-width="${8+4*hb}" stroke-linecap="round"/>${hb>0.4?sparkle(cx+rx+22+10*hb,cy-34-14*hb,8+6*hb):''}`;
  if(tr>0.1) o+=wing(-1)+wing(1);
  o+=foot(-1)+foot(1);
  o+=`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#CDBEEA"/>`;
  o+=`<ellipse cx="${cx-rx*0.38}" cy="${cy-ry*0.45}" rx="${rx*0.22}" ry="${ry*0.13}" fill="#fff" opacity="${(0.28+0.5*bt).toFixed(2)}" transform="rotate(-25 ${cx-rx*0.38} ${cy-ry*0.45})"/>`;
  const ch=Math.max(f,sc*0.8);
  if(ch>0.05) o+=[-1,1].map(sx=>`<circle cx="${cx+sx*rx*0.62}" cy="${cy+12}" r="${6+6*ch}" fill="#F4B6C8" opacity="${(0.5+0.4*ch).toFixed(2)}"/>`).join('');
  if(sc>0.12) o+=[-1,1].map(sx=>`<text x="${cx+sx*rx*0.62}" y="${cy-2}" font-size="${10+8*sc}" text-anchor="middle" fill="#E58AA8">♥</text>`).join('');
  o+=`<circle cx="${cx-ex}" cy="${ey}" r="6" fill="#3B3350"/><circle cx="${cx+ex}" cy="${ey}" r="6" fill="#3B3350"/><circle cx="${cx-ex+2}" cy="${ey-2}" r="2" fill="#fff"/><circle cx="${cx+ex+2}" cy="${ey-2}" r="2" fill="#fff"/>`;
  o+=`<path d="M${cx-9},${cy+12} Q${cx},${cy+22} ${cx+9},${cy+12}" fill="none" stroke="#3B3350" stroke-width="3" stroke-linecap="round"/>`;
  if(ln>0.25) o+=`<circle cx="${cx-ex}" cy="${ey}" r="13" fill="none" stroke="#3B3350" stroke-width="2.5"/><circle cx="${cx+ex}" cy="${ey}" r="13" fill="none" stroke="#3B3350" stroke-width="2.5"/><path d="M${cx-ex+13},${ey} L${cx+ex-13},${ey}" stroke="#3B3350" stroke-width="2.5"/>`;
  if(ln>0.55) o+=`<path d="M${cx-30},${cy-ry+6} L${cx},${cy-ry-10} L${cx+30},${cy-ry+6} L${cx},${cy-ry+18} Z" fill="#3B3350"/><path d="M${cx+22},${cy-ry+9} L${cx+22},${cy-ry+28}" stroke="#F2D27A" stroke-width="3" stroke-linecap="round"/>`;
  if(bt>0.12){ const bx=cx-rx*0.5, by=cy-ry*0.78, k=0.7+0.7*bt; o+=`<g transform="translate(${bx},${by}) scale(${k}) rotate(-15)"><path d="M0,0 L-18,-11 L-18,11 Z M0,0 L18,-11 L18,11 Z" fill="#8FB4E0" stroke="#6C93C4" stroke-width="2" stroke-linejoin="round"/><circle r="5" fill="#6C93C4"/></g>`; }
  if(kd>0.12){ const mx=cx-rx-16, my=cy+ry-10, k=0.45+0.4*kd; o+=`<g transform="translate(${mx},${my}) scale(${k})"><ellipse rx="26" ry="23" fill="#DCD0EE" stroke="#BBA8DD" stroke-width="3"/><circle cx="-9" cy="-3" r="3.5" fill="#3B3350"/><circle cx="9" cy="-3" r="3.5" fill="#3B3350"/><path d="M-6,7 Q0,13 6,7" fill="none" stroke="#3B3350" stroke-width="2.5" stroke-linecap="round"/></g>`; }
  if(dl>0.1){ const r=5+6*dl; o+=sparkle(34,58,r)+sparkle(208,48,r*0.8)+(dl>0.4?sparkle(216,168,r*0.7)+sparkle(26,176,r*0.9):''); }
  return `<svg viewBox="-40 0 320 240" width="${px}" height="${px*0.75}" role="img" aria-label="あなたのなかま。支出の割合で見た目が変わります" style="display:block;margin:0 auto"><g class="bob">${o}</g></svg>`;
}

/* --- 入力 --- */
function applyMask(inp, n){
  const prev=inp.value, pos=inp.selectionStart===null?prev.length:inp.selectionStart;
  const before=prev.slice(0,pos).replace(/[^\d]/g,'').length;
  const has=prev.replace(/[^\d]/g,'')!=='';
  const nv=has?n.toLocaleString('ja-JP'):'';
  inp.value=nv;
  let np=nv.length;
  if(before===0) np=0; else { let seen=0; for(let i=0;i<nv.length;i++){ if(/\d/.test(nv[i])){ seen++; if(seen===before){ np=i+1; break; } } } }
  try{ inp.setSelectionRange(np,np); }catch(e){}
}
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-path]'); if(!el) return;
  const [root,p]=el.dataset.path.split(':'); const keys=p.split('.');
  let o=ROOTS[root](); for(let i=0;i<keys.length-1;i++) o=o[keys[i]];
  const last=keys[keys.length-1], kind=el.dataset.kind||'text';
  if(kind==='money'){ const v=num(el.value); o[last]=v; applyMask(el,v); }
  else if(kind==='num'||kind==='float'){ o[last]=num(el.value); }
  else o[last]=el.value;
  if(root==='S') persist();
  if(el.dataset.rer){ render(); return; }
  updateDyn();
});

    case 'w-edit': { const w=S.wishes.find(x=>x.id===id); if(w){ WF=Object.assign({},w); render(); $('#wform').scrollIntoView({behavior:'smooth'}); } break; }
    case 'w-cancel': resetWF(); render(); break;
    case 'w-status': { const w=S.wishes.find(x=>x.id===id); if(w){ w.status=v; R(); toast(v==='decided'?'決定にしました。計画に入りました':statusLabel(v)+'にしました'); } break; }
    case 'w-del': { S.wishes=S.wishes.filter(x=>x.id!==id); if(WF.id===id) resetWF(); R(); toast('削除しました'); break; }
    case 'copy-contact': copyText(CONTACT_EMAIL).then(ok=>toast(ok?'コピーしました':'メールアドレスを長押しして、コピーしてください')); break;
    case 'data-copy': { const t=dataJSON(); copyText(t).then(ok=>{ if(ok) toast('コピーしました。メモアプリなどに貼り付けて保管してください'); else showCopyBox(t); }); break; }
    case 'data-paste': showImportBox(); break;
    case 'export-copy': { const t=buildSheetTSV(); copyText(t).then(ok=>{ if(ok) toast('コピーしました。スプレッドシートのA1に貼り付けてください'); else showCopyBox(t); }); break; }
    case 'when-auto': S.branchStart=0; R(); break;
    case 'mf-unlock': { const k=b.dataset.k; ask('Money Forwardの実績と、ずれます。手で修正しますか?\n(あとで実績に戻せます)',()=>{ S.mf.locked[k]=false; S.mf.manual[k]=true; R(); }); break; }
    case 'mf-relock': { const k=b.dataset.k; S[k]=S.mf.values[k]; S.mf.manual[k]=false; S.mf.locked[k]=true; R(); toast('実績に戻しました'); break; }
    case 'ocr-manual': UI.ocr={cash:0,fund:0,stock:0,bond:0,point:0,total:0}; UI.ocrState='done'; UI.ocrMsg=''; render(); break;
    case 'ocr-apply': {
      const c=ocrCheck(), o=UI.ocr; if(!o||(!(o.cash>0)&&!(c.inv>0))){ toast('金額を入れてください'); break; }
      const t=new Date(), ds=`${t.getFullYear()}/${String(t.getMonth()+1).padStart(2,'0')}/${String(t.getDate()).padStart(2,'0')}`;
      const as={date:ds,cash:Math.round(o.cash||0),invest:Math.round(c.inv),cols:['預金・現金','投資信託','株式(現物)','債券']};
      const done=applyMF(null,as); S.mf.report=Object.assign({},S.mf.report||{},{as,done:(S.mf.report&&S.mf.report.done||[]).concat(['資産']),at:S.mf.importedAt});
      persist(); UI.ocrState='idle'; UI.ocr=null; if(UI.ocrUrl){ try{URL.revokeObjectURL(UI.ocrUrl);}catch(e){} UI.ocrUrl=null; }
      render(); toast('資産に反映しました'); break; }
    case 'sug-apply': { const g=calc().sug; if(!g||!g.tot) break;
      S.branchSpend=g.tot; S.branchYears=g.yrs; S.branchStart=g.st; persist();
      go('plan'); setTimeout(()=>{ const e=$('#whenCard'); if(e) e.scrollIntoView({behavior:'smooth',block:'start'}); },50); break; }
    case 'view': S.viewEnd=+v; R(); break;
    case 'wi-add': {
      const a=Math.round(S.age); let w;
      if(v==='job') w={type:'job',age:a+2,income:Math.round(S.income*1.1/10000)*10000};
      if(v==='child') w={type:'child',age:a+4,cost:1000000,years:22,birth:500000};
      if(v==='retire') w={type:'retire',age:Math.max(a+1,Math.min(50,S.retireAge-1))};
      if(v==='side') w={type:'side',age:a+1,endAge:S.retireAge,income:600000};
      if(v==='cost') w={type:'cost',age:a+3,amount:3000000,repeat:false,endAge:a+13};
      w.on=true; S.whatifs.push(w); R(); toast('足しました'); break; }
    case 'wi-toggle': S.whatifs[i].on=!S.whatifs[i].on; R(); break;
    case 'wi-del': S.whatifs.splice(i,1); R(); break;
    case 'wi-repeat': S.whatifs[i].repeat=(v==='repeat'); if(S.whatifs[i].endAge<=S.whatifs[i].age) S.whatifs[i].endAge=S.whatifs[i].age+10; R(); break;
    case 'wi-apply': {
      const w=S.whatifs[i]; if(!w) break;
      if(w.type==='job') S.careerChanges.push({age:w.age,income:w.income});
      if(w.type==='child'){ S.fixed.push({label:'子どもの養育費',type:'repeat',startAge:w.age,endAge:w.age+Math.max(1,w.years)-1,amount:w.cost}); if(w.birth>0) S.fixed.push({label:'出産・準備費',type:'once',startAge:w.age,endAge:w.age,amount:w.birth}); }
      if(w.type==='retire') S.retireAge=w.age;
      if(w.type==='side') S.spouse.push({label:'副業の収入',startAge:w.age,endAge:w.endAge,income:w.income});
      if(w.type==='cost') S.fixed.push({label:'大きな出費',type:w.repeat?'repeat':'once',startAge:w.age,endAge:w.repeat?w.endAge:w.age,amount:w.amount});
      S.whatifs.splice(i,1); R(); toast('計画に反映しました(「計画」で確認できます)'); break; }
    case 'start-submit': {
      const o=UI.ob;
      if(!(o.age>=18&&o.age<=80)){ toast('年齢を、18〜80の間で入れてください'); break; }
      const s=defaultState(); s.age=Math.round(o.age);
      const living=o.living>0?o.living:250000;
      s.expense=living; s.postExpense=Math.round(living*0.85/1000)*1000;
      if(o.income>0) s.income=o.income;
      const total=o.asset>0?o.asset:0;
      s.cash=Math.min(total,living*6); s.invest=Math.max(0,total-s.cash);
      s.retireAge=Math.max(65,s.age+1); s.lifeEnd=Math.max(95,s.retireAge+10); s.viewEnd=s.retireAge;
      s.monthlyInvest=o.save>0?o.save:0;
      S=s; store.started=true; resetWF(); seedMF(); persist(); go('home'); break; }
    case 'start-sample': S=sampleState(); store.started=true; resetWF(); seedMF(); persist(); go('home'); break;
    case 'reset':
      ask('入力したデータを、すべて消します。よろしいですか?',()=>{ try{localStorage.removeItem(KEY);}catch(err){} store={started:false,S:null,patterns:[null,null,null],cur:0}; S=defaultState(); resetWF(); UI.ob={age:0,asset:0,income:0,living:0,save:0}; go('start'); });
      break;
  }
});

document.addEventListener('change',async e=>{
  if(e.target.id==='dataFile'){ const f=e.target.files&&e.target.files[0]; if(!f) return; const t=await f.text();
    ask('今のデータは、ファイルの内容に置き換わります。よろしいですか?',()=>{ const err=importDataText(t); if(err) toast(err); else { go('home'); toast('データを読み込みました'); } }); return; }
  if(e.target.id==='imgFile'){ ocrFile(e.target.files&&e.target.files[0]); return; }
  if(e.target.id!=='mfFile') return;
  const files=[...e.target.files]; if(!files.length) return;
  const out=await handleFiles(files); render();
  toast(out.cf||out.as?'読み込みました':'読み込めませんでした');
});
/* --- 起動 --- */
/* Money Forward の入出金データ(2026/01〜2026/10/27)を、最初から読み込み済みにする。
   更新するときは、ホームの「Money Forward」から新しいCSVを選ぶと入れ替わります。 */
const SEED_CSV = "";
/* 資産(Money Forwardの「資産 > 推移」画面 2026/10/29 時点の画面から転記。ポイントは含めない) */
const SEED_ASSET = null;
function seedMF(){
  try{
    if(!SEED_CSV && !SEED_ASSET) return;
    const needCF=!!SEED_CSV && !S.mf, needAS=!!SEED_ASSET && !(S.mf&&S.mf.values&&S.mf.values.cash!=null);
    if(!needCF&&!needAS) return;
    const cf=needCF?analyzeCash(parseCSV(SEED_CSV)):(S.mf&&S.mf.report&&S.mf.report.cf)||null;
    if(needCF&&!cf&&!needAS) return;
    const done=applyMF(needCF?cf:null, needAS?SEED_ASSET:null);
    S.mf.report={cf,as:needAS?SEED_ASSET:((S.mf.report&&S.mf.report.as)||null),done,at:S.mf.importedAt};
  }catch(e){}
}
loadStore();
if(store.started){ seedMF(); persist(); }
resetWF();
go(store.started ? 'home' : 'start');
</script>
