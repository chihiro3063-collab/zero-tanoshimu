<script>
'use strict';
/* =====================================================================
   ゼロまで、たのしむ — 計算の部分 (今までのシミュレーターのロジックをそのまま使用)
   ===================================================================== */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/[^\d.\-]/g,'')); return isNaN(n) ? 0 : n; };
const fmt = n => Math.round(n).toLocaleString('ja-JP');
const man = n => fmt(n/10000).replace('-','−');
const sman = n => { const m = Math.round(n/10000); return (m>0?'+':m<0?'−':'') + Math.abs(m).toLocaleString('ja-JP') + '万円'; };

/* --- 額面 → 手取り の概算 (単身・扶養なし) --- */
function employmentIncomeDeduction(g){
  if(g<=0) return 0;
  if(g<=1625000) return Math.min(g,550000);
  if(g<=1800000) return g*0.4-100000;
  if(g<=3600000) return g*0.3+80000;
  if(g<=6600000) return g*0.2+440000;
  if(g<=8500000) return g*0.1+1100000;
  return 1950000;
}
function progressiveIncomeTax(t){
  const br=[[1950000,0.05,0],[3300000,0.10,97500],[6950000,0.20,427500],[9000000,0.23,636000],[18000000,0.33,1536000],[40000000,0.40,2796000],[Infinity,0.45,4796000]];
  for(const [lim,r,d] of br){ if(t<=lim) return Math.max(0,t*r-d); }
  return 0;
}
function estimateNetIncome(g){
  if(g<=0) return 0;
  const ed=employmentIncomeDeduction(g), sh=g*0.145;
  const tn=Math.max(0,g-ed-sh-480000);
  const it=progressiveIncomeTax(tn)*1.021;
  const tr=Math.max(0,g-ed-sh-430000);
  return Math.max(0,Math.round(g-sh-it-(tr*0.10+5000)));
}

/* --- 物価上昇: 今日0% → 退職年齢で指定の率 → 以降一定 --- */
function buildIdx(age0, retireAge, totalYears, target){
  const idx=[1], ramp=Math.max(1,retireAge-age0);
  for(let i=0;i<totalYears-1;i++){ const t=Math.min(1,i/ramp); idx.push(idx[i]*(1+target*t)); }
  return idx;
}

/* --- やりたいこと → 計算用のイベント --- */
function wishToEvent(w){
  return {type:w.repeat?'repeat':'once', startAge:w.age, endAge:w.repeat?w.endAge:w.age, amount:w.amount};
}
/* 使う枠: 「◯〜◯歳に、年◯万円」。やりたいこと(決定)で埋まった分を引いた残りを、「使い道未定」として使う計算にする(二重に数えない) */
function slotWindow(){ const t=S.slot; if(!t) return null; const st=Math.round(t.st), yrs=Math.max(1,Math.round(t.yrs)); return {st,en:st+yrs-1,yrs,per:t.per}; }
function slotAlloc(evs){
  const W=slotWindow(); if(!W) return null; const rows=[];
  for(let y=W.st;y<=W.en;y++){
    let a=0; evs.forEach(e=>{ if(e.type==='once'&&Math.round(e.startAge)===y) a+=e.amount; if(e.type==='repeat'&&y>=e.startAge&&y<=e.endAge) a+=e.amount; });
    rows.push({age:y,alloc:a,free:Math.max(0,W.per-a),over:Math.max(0,a-W.per)});
  }
  return {W,rows};
}
function wishInSlot(w){ const W=slotWindow(); if(!W) return false; const st=Math.round(w.age), en=w.repeat?Math.round(w.endAge):st; return st>=W.st&&en<=W.en; }
function slotView(){
  const W=slotWindow(); if(!W) return null;
  const ins=S.wishes.filter(wishInSlot);
  const A=slotAlloc(ins.map(wishToEvent));
  const items=ins.map(w=>({w,alloc:slotAlloc([wishToEvent(w)]).rows.reduce((t,r)=>t+r.alloc,0)}));
  const free=A.rows.reduce((t,r)=>t+r.free,0), over=A.rows.reduce((t,r)=>t+r.over,0);
  return {W,items,free,over,rows:A.rows,total:W.per*W.yrs};
}
function wishEvents(mode){
  if(mode==='none') return [];
  if(Array.isArray(mode)) return mode.map(wishToEvent);
  if(mode==='all') return S.wishes.map(wishToEvent);
  return S.wishes.filter(w=>w.status==='decided').map(wishToEvent); // 'decided'(標準)
}

/* --- 本体: 年ごとの資産の計算 --- */
function simulate(o={}){
  const age0 = Math.round(S.age)||0;
  const lifeEnd = Math.max(age0, Math.round(S.lifeEnd)||0);
  const WP0 = (o.wi===undefined&&!(S.whatifs&&S.whatifs.length)) ? null : wiParts(o.wi!==undefined?o.wi:S.whatifs);
  const retireAge = o.retireAge!==undefined ? o.retireAge : (WP0&&WP0.retireAge!==undefined ? WP0.retireAge : S.retireAge);
  const total = Math.max(1, lifeEnd-age0+1);
  const idx = buildIdx(age0, retireAge, total, S.inflation/100);
  const toNet = a => S.incomeMode==='gross' ? estimateNetIncome(a) : a;
  const career = (o.career || (WP0?WP0.career:S.careerChanges)).slice().sort((a,b)=>a.age-b.age);
  const WP = (o.wi===undefined&&!(S.whatifs&&S.whatifs.length)) ? null : wiParts(o.wi!==undefined?o.wi:S.whatifs);
  const fixedEvents = S.fixed, wishEvs = wishEvents(o.wish).concat((WP&&WP.extra)||[]).concat(o.extra||[]);
  const r = S.returnRate/100, raise = S.raiseRate/100;
  const yearlyInvest = S.monthlyInvest*12;
  let cash=S.cash, invest=S.invest, insolventAge=null;
  const results=[];
  for(let i=0;i<total;i++){
    const age=age0+i, retired=age>=retireAge;
    if(insolventAge!==null){ /* 資金ショートのあとは、計算を続けない(借金にはしない) */
      results.push({age,cash:0,invest:0,total:0,draw:0,shortY:0,dead:true,income:0,spouse:0,pension:0,living:0,fixedY:0,wishY:0,contrib:0,growth:0,net:0,retired});
      continue;
    }
    let incomeY=0;
    if(!retired){
      let active=null; for(const c of career){ if(c.age<=age) active=c; else break; }
      incomeY = toNet(active ? active.income*Math.pow(1+raise, age-active.age) : S.income*Math.pow(1+raise, age-age0));
    }
    let spouseY=0;
    S.spouse.concat(o.spouseExtra||[]).concat((WP0&&WP0.spouseExtra)||[]).forEach(s=>{ if(age>=s.startAge && age<=s.endAge) spouseY+=toNet(s.income); });
    const living = retired ? S.postExpense*12*idx[i] : S.expense*12*idx[i];
    const pensionY = age>=Math.max(retireAge,65) ? S.pension*12*idx[i] : 0;
    const evSum=list=>{ let t=0; list.forEach(e=>{
      const amt=e.amount*idx[i];
      if(e.type==='once' && Math.round(e.startAge)===age) t+=amt;
      if(e.type==='repeat' && age>=e.startAge && age<=e.endAge) t+=amt;
    }); return t; };
    const fixedY=evSum(fixedEvents), wishY=evSum(wishEvs), eventY=fixedY+wishY;
    const contrib = retired ? 0 : yearlyInvest;
    const growth = invest*r, net = incomeY+spouseY+pensionY-living-eventY-contrib;
    cash += net;
    invest = invest*(1+r)+contrib;
    let drew=0, shortY=0;
    if(cash<0){ /* 現金が足りない年は、投資を取り崩す。投資も尽きたら資金ショート(借金にはしない) */
      const sf=-cash; drew=Math.min(sf,invest); invest-=drew; cash=0;
      shortY=sf-drew; if(shortY>1) insolventAge=age;
    }
    results.push({age,cash,invest,total:cash+invest,draw:drew,shortY,income:incomeY,spouse:spouseY,pension:pensionY,living,fixedY,wishY,contrib,growth,net,retired});
  }
  return {results, insolventAge, retireAge, lifeEnd};
}

/* --- 結果を見る小さな道具 --- */
function simEnd(sim){ const r=sim.results; return r[r.length-1].total; }
function simOK(sim){ return sim.insolventAge===null && simEnd(sim)>=S.leave; }
function finalTotal(o, X){
  const ex=(o.extra||[]).concat([{type:'once',startAge:Math.round(S.age),endAge:Math.round(S.age),amount:X}]);
  return simEnd(simulate(Object.assign({},o,{extra:ex})));
}
/* 借金なし: どの年も資金ショートせず、寿命の年に「残したい額」を割らないか */
function okAfter(o){ return simOK(simulate(o)); }
/* やりたいこと1つを足すと、その年に投資をいくら取り崩すか */
function wishImpact(w){
  const base=S.wishes.filter(x=>x.status==='decided'&&x.id!==w.id);
  const A=simulate({wish:base}), B=simulate({wish:base.concat([w])});
  const a0=Math.round(S.age), st=Math.round(w.age), en=w.repeat?Math.round(w.endAge):st;
  const span=r=>r.age>=st&&r.age<=en;
  const dA=A.results.filter(span).reduce((t,r)=>t+r.draw,0), dB=B.results.filter(span).reduce((t,r)=>t+r.draw,0);
  const rb=B.results, prev=rb.find(r=>r.age===st-1);
  const before=st<=a0?S.invest:(prev?prev.invest:0);
  const last=rb.find(r=>r.age===en)||rb[rb.length-1];
  return {draw:Math.max(0,dB-dA),before,after:last.invest,st,en,ins:B.insolventAge,baseIns:A.insolventAge,ok:simOK(B),end:simEnd(B)};
}
function impactView(e){

  }
  return {cls:'ok',main:'貯金と収入で、まかなえます',sub:'',ratio:0};
}

const WTYPES={
  job:{label:'転職・収入が変わる',icon:'brief'},
  child:{label:'子どもが生まれる',icon:'heart'},

function wiParts(list){
  const career=S.careerChanges.slice(), extra=[], spouseExtra=[]; let retireAge;
  list.filter(w=>w.on).forEach(w=>{
    if(w.type==='job') career.push({age:w.age,income:w.income});
    if(w.type==='child'){
      extra.push({type:'repeat',startAge:w.age,endAge:w.age+Math.max(1,w.years)-1,amount:w.cost});
      if(w.birth>0) extra.push({type:'once',startAge:w.age,endAge:w.age,amount:w.birth});
    }

  });
  const o={wish:'decided',extra,career,spouseExtra};
  if(retireAge!==undefined) o.retireAge=retireAge;

}
/* 「いつ使える?」: 開始年齢ごとに、95歳の資産がどうなるかを調べる */
function whenState(){
  const g=suggest(); const a0=Math.round(S.age);
  return {st: Math.round(S.branchStart)>0 ? Math.round(S.branchStart) : (g&&g.st?g.st:a0)};
}
function whenCalc(){
  const a0=Math.round(S.age), yrs=Math.max(1,Math.min(Math.round(S.branchYears)||1, S.lifeEnd-a0));
  const total=S.branchSpend, base=simulate({wish:'decided'}).results, last=S.lifeEnd-yrs+1, rows=[];
  for(let st=a0; st<=last; st++){
    const sm=simulate({wish:'decided',extra:[{type:'repeat',startAge:st,endAge:st+yrs-1,amount:total/yrs}]}), r=sm.results;
    const fin=simEnd(sm), neg=sm.insolventAge!==null;
    rows.push({st,fin,neg,ins:sm.insolventAge,short:neg||fin<S.leave,r});
  }
  return {rows,base,a0,yrs,last};
}
/* 「こんな使い方もできるかも」の提案: 5年間、使える上限の半分くらいを毎年使う */
function suggest(){
  if(!(S.leave>0)) return null;
  const a0=Math.round(S.age), yrs=5;
  const sts=[]; for(let st=Math.ceil((a0+2)/5)*5; st+yrs-1<=S.lifeEnd; st+=5) sts.push(st);
  if(!sts.length) return null;
  const mk=(st,M)=>({wish:'decided',extra:[{type:'repeat',startAge:st,endAge:st+yrs-1,amount:M/yrs}]});
  if(!okAfter(mk(sts[0],0))) return {st:sts[0],en:sts[0]+yrs-1,yrs,short:true};
  /* 使う時期の候補ごとに「残したい額を守れる最大額」を調べ、その額を使い切れる、いちばん早い時期を選ぶ */
  let best=null;
  for(const st of sts){
    let lo=0,hi=3e9; for(let i=0;i<32;i++){ const m=(lo+hi)/2; if(okAfter(mk(st,m))) lo=m; else hi=m; }
    const fin=simEnd(simulate(mk(st,lo)));
    const c={st,M:lo,fin};
    if(!best||lo>best.M) best=c;
    if(fin<=S.leave*1.05+1000000){ best=c; break; }
  }
  const st=best.st, en=st+yrs-1, M=best.M;
  let per=Math.floor(M/yrs/100000)*100000;
  if(per<=0) per=Math.floor(M/yrs/10000)*10000;
  if(per<=0) return {st,en,yrs,tight:true};
  const tot=per*yrs;
  return {st,en,yrs,max:M,per,tot,fin:finalTotal(mk(st,tot),0)};
}
let _k=null, _c=null;
function calc(){
  S.wishes.forEach(w=>{ if(w.status!=='decided') w.status='considering'; });
  const k=JSON.stringify(S);
  if(k===_k) return _c;
  const plan=simulate({wish:'decided'});
  const end=simEnd(plan), ok=simOK(plan);
  const sum=st=>S.wishes.filter(w=>w.status===st).reduce((a,w)=>a+(w.repeat?w.amount*Math.max(1,w.endAge-w.age+1):w.amount),0);
  const eff={}; S.wishes.forEach(w=>{ eff[w.id]=wishImpact(w); });
  _k=k; _c={plan,end,ok,ins:plan.insolventAge,D:sum('decided'),C:sum('considering'),I:0,eff,sug:suggest()};
  return _c;
}

function parseCSV(t){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(f); f=''; if(row.length>1||row[0]!=='') rows.push(row); row=[]; }
    else f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows;
}

async function unzipAll(buf){

  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50) throw new Error('zip');
    const method=dv.getUint16(p+10,true), cs=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lho=dv.getUint32(p+42,true);
    const name=dec.decode(u8.slice(p+46,p+46+nl)); p+=46+nl+el+cl;
    const ln=dv.getUint16(lho+26,true), le=dv.getUint16(lho+28,true), st=lho+30+ln+le;
    files[name]={method,data:u8.slice(st,st+cs)};

  const variable=exp.filter(x=>inRef(x)&&!FIXED_BIG.has(x.big)&&usable(x)).reduce((a,x)=>a-x.amt,0)/ref.length;
  const curVar=exp.filter(x=>x.dt.key===cur&&!FIXED_BIG.has(x.big)&&usable(x)).reduce((a,x)=>a-x.amt,0);
  const spare=avgSalary!=null ? avgSalary-fixed-S.monthlyInvest-curVar : null;

function analyzeAsset(rows){
  const h=rows[0], iD=colIdx(h,'日付');
  const cashCols=h.map((x,i)=>i).filter(i=>/預金|現金/.test(h[i])&&!/合計/.test(h[i]));
  const invCols=h.map((x,i)=>i).filter(i=>/株式|投資信託|債券/.test(h[i]));
  if(!cashCols.length&&!invCols.length) return null;
  let best=null;
  rows.slice(1).forEach(r=>{ const dt=parseDate(r[iD]); if(dt&&(!best||dt.key*100+dt.d>=best.dt.key*100+best.dt.d)) best={dt,r}; });
  if(!best) return null;
  return {date:best.dt.str,cash:cashCols.reduce((a,i)=>a+toNum(best.r[i]),0),invest:invCols.reduce((a,i)=>a+toNum(best.r[i]),0),cols:cashCols.concat(invCols).map(i=>h[i])};
}

function applyMF(cf,as,keepManual){

  const done=[];

    if(cf.avgSalary){ const bonus=(cf.bonusOn&&cf.bonusYear)?cf.bonusYear:0; set('income',Math.round((cf.avgSalary*12+bonus)/10000)*10000); S.incomeMode='net'; done.push('年収'); }

    if(cf.spare!=null){ set('spareNow',Math.round(cf.spare/100)*100); done.push('今月の余裕'); }
    if(cf.shares&&!keepManual){ S.shares=cf.shares; m.sharesLocked=true; done.push('うちの子'); }

async function handleFiles(files){

      if(kind==='cash'){ const it=rowsToItems(rows); if(it.length){ added=added.concat(it); out.names.push(f.name+'(収支)'); } else out.errors.push(`${f.name}: 読める行がありませんでした。`); }

    }catch(e){ out.errors.push(e&&e.message==='xls'?`${f.name}: 古い形式のExcel(.xls)は読めません。.xlsxで保存し直してください。`:`${f.name}: 読み込めませんでした。`); }
  }

}

function ocrNums(l){
  const out=[]; const re=/\d{1,3}(?:\s?[,，.、]\s?\d{3})+|\d{4,}/g; let m;
  while((m=re.exec(l))){ const v=parseInt(m[0].replace(/[^0-9]/g,''),10); if(v>=1000) out.push(v); }
  return out;
}
function parseAssetText(text){
  const lines=String(text||'').split(/\r?\n/).map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean);
  const kinds=[['total',/合計/],['fund',/投資信託|投信/],['stock',/株式|現物/],['cash',/預金|現金/],['bond',/債券/],['point',/ポイント|ポイン/]];
  const r={cash:0,fund:0,stock:0,bond:0,point:0,total:0}, found={};
  lines.forEach((l,i)=>{
    const k=kinds.find(x=>x[1].test(l)); if(!k||found[k[0]]) return;
    let n=ocrNums(l);
    if(!n.length&&lines[i+1]&&!kinds.some(x=>x[1].test(lines[i+1]))&&!/前日比|ヶ月前比|ヵ月前比/.test(lines[i+1])) n=ocrNums(lines[i+1]);
    if(n.length){ r[k[0]]=Math.max(...n); found[k[0]]=true; }
  });
  r.found=found; return r;
}
function loadTess(){
  return new Promise((res,rej)=>{
    if(window.Tesseract) return res(window.Tesseract);
    const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    sc.onload=()=>window.Tesseract?res(window.Tesseract):rej(new Error('no-tess')); sc.onerror=()=>rej(new Error('load')); document.head.appendChild(sc);
  });
}
function ocrStatus(t){ const e=$('#ocrStatus'); if(e) e.textContent=t; }
async function ocrFile(file){
  if(!file) return;
  if(UI.ocrUrl){ try{URL.revokeObjectURL(UI.ocrUrl);}catch(e){} }
  UI.ocrUrl=URL.createObjectURL(file); UI.ocrState='busy'; UI.ocr=null; UI.ocrMsg=''; render();
  try{
    ocrStatus('文字認識の部品を準備しています…(初回は少し時間がかかります)');
    const T=await loadTess();
    const worker=await T.createWorker('jpn',1,{logger:m=>{ if(m.status) ocrStatus(`読み取り中… ${m.status==='recognizing text'?Math.round((m.progress||0)*100)+'%':'準備中'}`); }});
    const {data}=await worker.recognize(file); try{ await worker.terminate(); }catch(e){}
    const r=parseAssetText(data.text);

  }

}

function spendStrip(n,a0,amt){

function spendSpans(n,X,amt){

      const fam=famText(r.age);
      return `<div class="yrow${r.over>0?' over':''}"><div class="yh"><span><b>${r.age}歳</b>${fam?`<span class="fam">${fam}</span>`:''}</span>${tag}</div>${items.map(w=>wishRow(w,'in',c)).join('')}
        ${UI.addYear===r.age?wishForm('in',r.age):`<button type="button" class="btn dash" style="margin-top:8px;min-height:44px" data-act="y-add" data-v="${r.age}">${ICON.plus} 使い道を足す</button>`}</div>`;
    }).join('');
    slotPart=`<section class="card" style="padding:16px 18px"><h2>使う枠</h2>
      <div style="font-size:15px;line-height:1.8;margin-top:6px"><b>${W.st}歳から${W.en}歳</b>に <b style="color:var(--pd);font-size:19px">年間 ${man(W.per)}万円</b><span style="color:var(--dim);font-size:12.5px">(合計 ${man(V.total)}万円)</span></div>
      <div style="font-size:17px;font-weight:800;color:var(--pd);margin:12px 0 4px">何に使いますか?</div>
      <div class="msgline ${V.over>0?'ng':'ok'}" style="margin-top:4px">${V.over>0?ICON.alert:ICON.check}<span>入れた使い道 ${man(Math.max(0,used))}万円 / ${V.over>0?`枠を ${man(V.over)}万円 こえている年があります`:`あと ${man(V.free)}万円`}</span></div>
      ${years}
      <button type="button" class="btn line full" style="margin-top:14px" data-act="slot-edit-go">枠を変える</button></section>`;
  } else {
    slotPart=`<section class="card"><h2>先に、使う枠を決めましょう</h2><p class="note" style="margin-top:6px">「計画」で、いつ・いくら使うかの枠を決めると、年ごとに使い道を入れられます。</p>
      <button type="button" class="btn full" style="margin-top:12px" data-act="go" data-v="plan">計画で、枠を決める</button></section>`;
  }
  const openOut=UI.openOut===undefined?!V:UI.openOut;
  const sub=(k,label,list)=>`<button type="button" class="fold" data-act="tg" data-k="${k}" aria-expanded="${!!UI[k]}"><span>${label} <b>${list.length}件</b></span>${UI[k]?ICON.up:ICON.down}</button>${UI[k]?(list.length?list.map(w=>wishRow(w,'out',c)).join(''):'<p class="note" style="margin:6px 0">まだありません</p>'):''}`;
  const outCard=`<section class="card" style="padding:16px 18px"><button type="button" class="fold top" data-act="tg" data-k="openOut" aria-expanded="${openOut}"><span><b style="font-size:16px">枠の外のやりたいこと</b> <b>${out.length}件</b></span>${openOut?ICON.up:ICON.down}</button>
    ${openOut?`${sub('openCon','検討中',con)}${sub('openDec','決定',dec)}${UI.addYear==='out'?wishForm('out'):`<button type="button" class="btn dash out" style="margin-top:12px" data-act="out-add">${ICON.plus} 枠の外に足す</button>`}`:''}</section>`;
  const chartCard=`<section class="card" style="padding:16px 18px"><h2>グラフで見る</h2>
    <label class="chk" style="margin-top:10px"><input type="checkbox" data-chk="inccon" ${UI.incCon?'checked':''}><span>検討中のやりたいことも、入れる</span></label>
    <div style="margin-top:12px" data-dyn="wChart"></div>
    <div class="legend"><span><em style="background:#6B55A0"></em>投資</span><span><em style="background:#8FB4E0"></em>現金</span><span><em style="background:#F2A33A"></em>投資を取り崩した年</span><span><em style="background:#E58FA3"></em>使うお金がある年</span></div></section>`;
  return header('夢を、リストにしてみよう','やりたいこと') + `<main class="stack">${slotPart}${outCard}${chartCard}</main>`;
}

      <button type="button" class="btn small ${w.on?'':'line'}" style="padding:0 14px;flex:0 0 auto" data-act="wi-toggle" data-i="${i}" aria-pressed="${w.on}">${w.on?'入れている':'外している'}</button></div>

function planMoneyList(){
  const L=[];
  S.fixed.forEach(e=>L.push({n:e.label||'出費',st:Math.round(e.startAge),en:e.type==='repeat'?Math.round(e.endAge):Math.round(e.startAge),amt:e.amount,per:e.type==='repeat',src:'くわしい設定',go:'fixed',idx:S.fixed.indexOf(e)}));
  S.wishes.forEach(w=>L.push({n:w.name,st:Math.round(w.age),en:w.repeat?Math.round(w.endAge):Math.round(w.age),amt:w.amount,per:w.repeat,src:'やりたいこと',tag:w.status==='decided'?'決定':'検討中',go:'wish',wid:w.id}));
  S.whatifs.filter(w=>w.on).forEach(w=>{
    if(w.type==='child'){ L.push({n:'子ども(養育費)',st:Math.round(w.age),en:Math.round(w.age)+Math.max(1,Math.round(w.years))-1,amt:w.cost,per:true,src:'これから起きること',go:'life',idx:S.whatifs.indexOf(w)}); if(w.birth>0) L.push({n:'子ども(出産・準備)',st:Math.round(w.age),en:Math.round(w.age),amt:w.birth,per:false,src:'これから起きること',go:'life',idx:S.whatifs.indexOf(w)}); }
    if(w.type==='cost') L.push({n:'大きな出費',st:Math.round(w.age),en:w.repeat?Math.round(w.endAge):Math.round(w.age),amt:w.amount,per:!!w.repeat,src:'これから起きること',go:'life',idx:S.whatifs.indexOf(w)});
  });
  L.sort((x,y)=>x.st-y.st);
  const kid=x=>/子|養育|出産/.test(x.n);
  L.forEach((x,i)=>{ x.dup=L.some((y,j)=>j!==i&&y.src!==x.src&&((Math.abs(y.st-x.st)<=1&&Math.abs(y.amt-x.amt)<=0.3*Math.max(x.amt,y.amt))||(kid(x)&&kid(y)&&x.st<=y.en&&y.st<=x.en))); });
  return L;
}

function applyMask(inp, n){
  const prev=inp.value, pos=inp.selectionStart===null?prev.length:inp.selectionStart;
  const before=prev.slice(0,pos).replace(/[^\d]/g,'').length;
  const has=prev.replace(/[^\d]/g,'')!=='';
  const nv=has?n.toLocaleString('ja-JP'):'';
  inp.value=nv;
  let np=nv.length;
  if(before===0) np=0; else { let seen=0; for(let i=0;i<nv.length;i++){ if(/\d/.test(nv[i])){ seen++; if(seen===before){ np=i+1; break; } } } }
  try{ inp.setSelectionRange(np,np); }catch(e){}
}
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-path]'); if(!el) return;
  const [root,p]=el.dataset.path.split(':'); const keys=p.split('.');
  let o=ROOTS[root](); for(let i=0;i<keys.length-1;i++) o=o[keys[i]];
  const last=keys[keys.length-1], kind=el.dataset.kind||'text';
  if(kind==='money'){ const v=num(el.value); o[last]=v; applyMask(el,v); }
  else if(kind==='num'||kind==='float'){ o[last]=num(el.value); }
  else o[last]=el.value;
  if(last==='ageIn'||last==='endIn'){ const off=whoOffset(WF.who||'me'); if(last==='ageIn') WF.age=Math.round(WF.ageIn+off); else WF.endAge=Math.round(WF.endIn+off); }
  if(root==='S') persist();
  if(el.dataset.rer){ render(); return; }
  updateDyn();
});

    case 'w-save': {
      if(!WF.name.trim()){ toast('やりたいことの名前を入れてください'); break; }
      if(!(WF.amount>0)){ toast('金額を入れてください'); break; }
      const w={id:WF.id||newId(),name:WF.name.trim(),amount:WF.amount,age:Math.round(WF.age),repeat:WF.repeat,endAge:WF.repeat?Math.round(WF.endAge):Math.round(WF.age),status:WF.status};
      if(WF.id){ const k=S.wishes.findIndex(x=>x.id===WF.id); S.wishes[k]=w; } else S.wishes.push(w);
      toast(WF.id?'保存しました':'リストに足しました'); UI.addYear=null; resetWF(); R(); break; }
    case 'y-add': resetWF(); WF.age=+v; WF.status='decided'; UI.addYear=+v; { const W1=slotWindow(); if(W1) WF.endAge=W1.en; } render(); break;
    case 'y-cancel': UI.addYear=null; resetWF(); render(); break;
    case 'w-edit': { const w=S.wishes.find(x=>x.id===id); if(w){ WF=Object.assign({who:'me'},w); if(wishInSlot(w)) UI.addYear=w.age; else { UI.addYear='out'; UI.openOut=true; } render(); const f=$('#wform'); if(f) f.scrollIntoView({behavior:'smooth',block:'center'}); } break; }
    case 'w-cancel': UI.addYear=null; resetWF(); render(); break;
    case 'w-status': { const w=S.wishes.find(x=>x.id===id); if(w){ w.status=(w.status==='decided'?'considering':'decided'); R(); toast(w.status==='decided'?'決定にしました。計画に入りました':'検討中にしました'); } break; }
    case 'w-del': { S.wishes=S.wishes.filter(x=>x.id!==id); if(WF.id===id) resetWF(); R(); toast('削除しました'); break; }
    case 'copy-contact': copyText(CONTACT_EMAIL).then(ok=>toast(ok?'コピーしました':'メールアドレスを長押しして、コピーしてください')); break;
    case 'data-copy': { const t=dataJSON(); copyText(t).then(ok=>{ if(ok) toast('コピーしました。メモアプリなどに貼り付けて保管してください'); else showCopyBox(t); }); break; }
    case 'data-paste': showImportBox(); break;
    case 'export-copy': { const t=buildSheetTSV(); copyText(t).then(ok=>{ if(ok) toast('コピーしました。スプレッドシートのA1に貼り付けてください'); else showCopyBox(t); }); break; }
    case 'when-auto': S.branchStart=0; R(); break;
    case 'mf-unlock': { const k=b.dataset.k; ask('Money Forwardの実績と、ずれます。手で修正しますか?\n(あとで実績に戻せます)',()=>{ S.mf.locked[k]=false; S.mf.manual[k]=true; R(); }); break; }
    case 'mf-period': { const o=Object.assign({},optOf(),{period:v}); const c=S.mf&&S.mf.report&&S.mf.report.cf; if(v==='custom'&&c){ if(o.from==null) o.from=c.refFrom; if(o.to==null) o.to=c.refTo; } S.mf.opt=o; reanalyze(); R(); break; }
    case 'mf-bonus': { S.mf.opt=Object.assign({},optOf(),{bonus:v==='1'}); reanalyze(); R(); break; }
    case 'mf-clear': ask('読み込んだ収支の明細を消します。反映済みの数字は、そのまま残ります。よろしいですか?',()=>{ store.mfItems=[]; R(); toast('消しました'); }); break;
    case 'mf-relock': { const k=b.dataset.k; S[k]=S.mf.values[k]; S.mf.manual[k]=false; S.mf.locked[k]=true; R(); toast('実績に戻しました'); break; }
    case 'ocr-manual': UI.ocr={cash:0,fund:0,stock:0,bond:0,point:0,total:0}; UI.ocrState='done'; UI.ocrMsg=''; render(); break;
    case 'ocr-apply': {
      const c=ocrCheck(), o=UI.ocr; if(!o||(!(o.cash>0)&&!(c.inv>0))){ toast('金額を入れてください'); break; }
      const t=new Date(), ds=`${t.getFullYear()}/${String(t.getMonth()+1).padStart(2,'0')}/${String(t.getDate()).padStart(2,'0')}`;
      const as={date:ds,cash:Math.round(o.cash||0),invest:Math.round(c.inv),cols:['預金・現金','投資信託','株式(現物)','債券']};
      const done=applyMF(null,as); S.mf.report=Object.assign({},S.mf.report||{},{as,done:(S.mf.report&&S.mf.report.done||[]).concat(['資産']),at:S.mf.importedAt});
      persist(); UI.ocrState='idle'; UI.ocr=null; if(UI.ocrUrl){ try{URL.revokeObjectURL(UI.ocrUrl);}catch(e){} UI.ocrUrl=null; }
      render(); toast('資産に反映しました'); break; }
    case 'sug-fill': { const g=calc().sug; if(!g||!g.tot) break; S.branchSpend=g.tot; S.branchYears=g.yrs; S.branchStart=g.st; R(); break; }
    case 'sug-apply': { const g=calc().sug; if(!g||!g.tot) break;
      S.branchSpend=g.tot; S.branchYears=g.yrs; S.branchStart=g.st; persist();
      go('plan'); setTimeout(()=>{ const e=$('#whenCard'); if(e) e.scrollIntoView({behavior:'smooth',block:'start'}); },50); break; }
    case 'view': S.viewEnd=+v; R(); break;
    case 'wi-add': {
      const a=Math.round(S.age); let w;
      if(v==='job') w={type:'job',age:a+2,income:Math.round(S.income*1.1/10000)*10000};
      if(v==='child') w={type:'child',age:a+4,cost:1000000,years:22,birth:500000};
      if(v==='retire') w={type:'retire',age:Math.max(a+1,Math.min(50,S.retireAge-1))};
      if(v==='side') w={type:'side',age:a+1,endAge:S.retireAge,income:600000};
      if(v==='cost') w={type:'cost',age:a+3,amount:3000000,repeat:false,endAge:a+13};
      w.on=true; S.whatifs.push(w); R(); toast('足しました'); break; }
    case 'wi-toggle': S.whatifs[i].on=!S.whatifs[i].on; R(); break;
    case 'wi-del': S.whatifs.splice(i,1); R(); break;
    case 'wi-repeat': S.whatifs[i].repeat=(v==='repeat'); if(S.whatifs[i].endAge<=S.whatifs[i].age) S.whatifs[i].endAge=S.whatifs[i].age+10; R(); break;
    case 'wi-apply': {
      const w=S.whatifs[i]; if(!w) break;
      if(w.type==='job') S.careerChanges.push({age:w.age,income:w.income});
      if(w.type==='child'){ S.fixed.push({label:'子どもの養育費',type:'repeat',startAge:w.age,endAge:w.age+Math.max(1,w.years)-1,amount:w.cost}); if(w.birth>0) S.fixed.push({label:'出産・準備費',type:'once',startAge:w.age,endAge:w.age,amount:w.birth}); }
      if(w.type==='retire') S.retireAge=w.age;
      if(w.type==='side') S.spouse.push({label:'副業の収入',startAge:w.age,endAge:w.endAge,income:w.income});
      if(w.type==='cost') S.fixed.push({label:'大きな出費',type:w.repeat?'repeat':'once',startAge:w.age,endAge:w.repeat?w.endAge:w.age,amount:w.amount});
      S.whatifs.splice(i,1); R(); toast('計画に反映しました(「計画」で確認できます)'); break; }
    case 'start-submit': {
      const o=UI.ob;
      if(!(o.age>=18&&o.age<=80)){ toast('年齢を、18〜80の間で入れてください'); break; }
      const s=defaultState(); s.age=Math.round(o.age);
      const living=o.living>0?o.living:250000;
      s.expense=living; s.postExpense=239000;
      if(o.income>0) s.income=o.income;
      const total=o.asset>0?o.asset:0;
      s.cash=Math.min(total,living*6); s.invest=Math.max(0,total-s.cash);
      s.retireAge=Math.max(65,s.age+1); s.lifeEnd=Math.max(95,s.retireAge+10); s.viewEnd=s.retireAge;
      s.monthlyInvest=o.save>0?o.save:0;
      s.household=JSON.parse(JSON.stringify(o.hh||{type:'single',spouseAge:0,kids:[]})); s.pension=PENSION[s.household.type]||PENSION.single;
      S=s; store.started=true; resetWF(); seedMF(); persist(); if(!store.guideSeen) UI.guide=0; go('home'); break; }
    case 'start-sample': S=sampleState(); store.started=true; resetWF(); seedMF(); persist(); if(!store.guideSeen) UI.guide=0; go('home'); break;
    case 'reset':
      ask('入力したデータを、すべて消します。よろしいですか?',()=>{ try{localStorage.removeItem(KEY);}catch(err){} store={started:false,S:null,patterns:[null,null,null],cur:0}; S=defaultState(); resetWF(); UI.ob={age:0,asset:0,income:0,living:0,save:0}; go('start'); });
      break;
  }
});

document.addEventListener('change',async e=>{
  if(e.target.dataset&&e.target.dataset.chk==='wf-rep'){ WF.repeat=e.target.checked; if(WF.repeat){ const W0=slotWindow(); if(typeof UI.addYear==='number'&&W0) WF.endAge=Math.max(WF.age,W0.en); else if(WF.endAge<=WF.age) WF.endAge=WF.age+5; } render(); return; }
  if(e.target.dataset&&e.target.dataset.chk==='inccon'){ UI.incCon=e.target.checked; render(); return; }
  if(e.target.id==='dataFile'){ const f=e.target.files&&e.target.files[0]; if(!f) return; const t=await f.text();
    ask('今のデータは、ファイルの内容に置き換わります。よろしいですか?',()=>{ const err=importDataText(t); if(err) toast(err); else { go('home'); toast('データを読み込みました'); } }); return; }
  if(e.target.dataset&&e.target.dataset.sel&&S.mf){ const o=Object.assign({},optOf(),{period:'custom'}); o[e.target.dataset.sel]=+e.target.value; S.mf.opt=o; reanalyze(); persist(); render(); return; }
  if(e.target.id==='imgFile'){ ocrFile(e.target.files&&e.target.files[0]); return; }
  if(e.target.id!=='mfFile') return;
  const files=[...e.target.files]; if(!files.length) return;
  const out=await handleFiles(files); render();
  toast(out.cf||out.as?'読み込みました':'読み込めませんでした');
});
/* --- 起動 --- */
/* Money Forward の入出金データ(2026/01〜2026/10/27)を、最初から読み込み済みにする。
   更新するときは、ホームの「Money Forward」から新しいCSVを選ぶと入れ替わります。 */
const SEED_CSV = "";
/* 資産(Money Forwardの「資産 > 推移」画面 2026/10/29 時点の画面から転記。ポイントは含めない) */
const SEED_ASSET = null;
function seedMF(){
  try{
    if(!SEED_CSV && !SEED_ASSET) return;
    const needCF=!!SEED_CSV && !S.mf, needAS=!!SEED_ASSET && !(S.mf&&S.mf.values&&S.mf.values.cash!=null);
    if(!needCF&&!needAS) return;
    const cf=needCF?(store.mfItems=mergeItems(store.mfItems,rowsToItems(parseCSV(SEED_CSV))),analyzeItems(store.mfItems,optOf())):(S.mf&&S.mf.report&&S.mf.report.cf)||null;
    if(needCF&&!cf&&!needAS) return;
    const done=applyMF(needCF?cf:null, needAS?SEED_ASSET:null);
    S.mf.report={cf,as:needAS?SEED_ASSET:((S.mf.report&&S.mf.report.as)||null),done,at:S.mf.importedAt};
  }catch(e){}
}

/* ---- はじめてのガイド(3枚・1回だけ・とばせる) ---- */
const GUIDE=[
  {t:'このままだと、95歳に いくら余る？',d:'年齢・資産・収入を入れると、すぐに分かります。数字は、画面の一番上に、いつも出ています。'},
  {t:'残したい金額を決めて、使う枠を作ろう',d:'「計画」で、95歳に残したい金額を入れると、使えるお金のおすすめが出ます。そこから、いつ・いくら使うかの「枠」を決めます。'},
  {t:'枠の中に、やりたいことを入れよう',d:'旅行や車など、年ごとに使い道を入れます。転職や出産などは、「計画」の「これから起きること」で試せます。わからなくなったら、右上の「？」から、いつでも見られます。'}
];
function renderGuide(){
  const g=$('#guide'); if(!g) return;
  if(UI.guide===null||UI.guide===undefined||!store.started){ g.classList.add('hide'); g.innerHTML=''; return; }
  const i=UI.guide, x=GUIDE[i], last=i===GUIDE.length-1;
  g.classList.remove('hide');
  g.innerHTML=`<div class="gcard"><button type="button" class="gskip" data-act="guide-skip">とばす</button>
    <div class="gnum">${i+1}</div><h3>${x.t}</h3><p>${x.d}</p>
    <div class="gdots">${GUIDE.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>
    <button type="button" class="btn full round" data-act="guide-next">${last?'はじめる':'つぎへ'}</button></div>`;
}
loadStore();
if(store.started){ seedMF(); if(!store.guideSeen) UI.guide=0; persist(); }
resetWF();
go(store.started ? 'home' : 'start');
</script>
